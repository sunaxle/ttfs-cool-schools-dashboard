<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cool Schools - Path of Leaves (Concept B v4)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Observer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --sand: #F4F1EA;
      --earth: #4A4036;
      --leaf-dark: #2F3E2B;
      --accent: #C25C3A;
      --card-bg: #FFFFFF;
    }

    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: var(--sand); font-family: 'Outfit', sans-serif;
      overflow: hidden; color: var(--earth); -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
      opacity: 0.05; pointer-events: none; z-index: 9999;
    }

    /* SECTION 1: LAYERED LEAVES REVEAL */
    .scene { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }

    .title-screen { position: absolute; text-align: center; z-index: 6; pointer-events: none; top: 50%; transform: translateY(-50%); }
    .title-screen h1 { font-family: 'Playfair Display', serif; font-size: 5rem; margin: 0; color: var(--leaf-dark); line-height: 1.1; }
    .title-screen h1 span { display: block; font-style: italic; font-size: 4rem; color: var(--accent); font-weight: 400; }
    .title-screen p { font-size: 1.2rem; margin-top: 1.5rem; color: var(--earth); letter-spacing: 1px; text-transform: uppercase; }

    .leaf-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; overflow: hidden; }
    .leaf-img { position: absolute; mix-blend-mode: multiply; object-fit: contain; filter: contrast(1.05) saturate(1.1); will-change: transform; }
    #leaf1 { width: 75vw; max-width: 900px; top: -15%; left: -20%; transform: rotate(-15deg); }
    #leaf2 { width: 60vw; max-width: 800px; bottom: -25%; right: -15%; transform: rotate(35deg); }
    #leaf3 { width: 80vw; max-width: 1000px; top: -10%; right: -25%; transform: rotate(115deg); z-index: 11; }

    .instruction { position: absolute; bottom: 40px; text-align: center; width: 100%; font-size: 1rem; letter-spacing: 3px; text-transform: uppercase; z-index: 15; color: var(--earth); opacity: 0.6; cursor: pointer; pointer-events: auto; transition: opacity 0.3s; }
    .instruction:hover { opacity: 1; }

    .cards-container { display: flex; gap: 4rem; z-index: 5; opacity: 0; transform: translateY(40px); padding: 0 2rem; }
    .card { width: 360px; background: var(--card-bg); border-radius: 16px; padding: 3rem 2.5rem; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 10px 30px rgba(74, 64, 54, 0.05); transition: transform 0.5s, box-shadow 0.5s; cursor: pointer; position: relative; border: 1px solid rgba(0,0,0,0.03); }
    .card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--leaf-dark); border-radius: 16px 16px 0 0; opacity: 0; transition: opacity 0.3s; }
    .card:hover { transform: translateY(-12px); box-shadow: 0 20px 40px rgba(74, 64, 54, 0.08); }
    .card:hover::before { opacity: 1; }
    .card img { width: 120px; height: 120px; border-radius: 50%; object-fit: contain; margin-bottom: 2rem; background: #FFF; box-shadow: 0 8px 20px rgba(0,0,0,0.06); padding: 10px; }
    .card h2 { font-family: 'Playfair Display', serif; font-size: 2.2rem; margin: 0 0 1rem 0; color: var(--leaf-dark); }
    .card p { font-size: 1rem; line-height: 1.7; opacity: 0.8; margin-bottom: 2.5rem; flex-grow: 1; }
    .card button { background: var(--sand); color: var(--leaf-dark); border: 1px solid rgba(0,0,0,0.1); padding: 14px 36px; font-family: 'Outfit', sans-serif; font-size: 1.05rem; font-weight: 600; border-radius: 40px; cursor: pointer; transition: all 0.3s ease; width: 100%; }
    .card:hover button { background: var(--leaf-dark); color: #FFF; border-color: var(--leaf-dark); }

    /* SECTION 2: PATH OF LEAVES */
    #campus-path-section {
      width: 100%;
      background-color: var(--sand);
      position: relative;
      display: none;
      opacity: 0;
      padding: 100px 20px;
    }
    .path-header { text-align: center; margin-bottom: 100px; font-family: 'Playfair Display', serif; font-size: 3.5rem; color: var(--leaf-dark); }
    .timeline { position: relative; max-width: 1000px; margin: 0 auto; }
    .timeline::after { content: ''; position: absolute; width: 4px; background-color: var(--leaf-dark); opacity: 0.15; top: 0; bottom: 0; left: 50%; margin-left: -2px; border-radius: 4px; }
    .timeline-node { padding: 10px 40px; position: relative; background-color: inherit; width: 50%; opacity: 0; transform: translateY(40px); }
    .timeline-node.left { left: 0; text-align: right; }
    .timeline-node.right { left: 50%; }
    .timeline-node::after { content: '❦'; position: absolute; width: 40px; height: 40px; right: -20px; background-color: var(--sand); border: 2px solid var(--leaf-dark); top: 15px; border-radius: 50%; z-index: 1; display: flex; align-items: center; justify-content: center; color: var(--leaf-dark); font-size: 1.2rem; }
    .timeline-node.right::after { left: -20px; }

    .campus-card-content { padding: 30px; background: white; border: 1px solid rgba(0,0,0,0.05); position: relative; border-radius: 12px; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; text-align: left; }
    .campus-card-content:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.05); border-color: var(--accent); }
    .campus-card-content h3 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-bottom: 5px; color: var(--leaf-dark); }
    .campus-card-content p { font-size: 0.9rem; color: var(--earth); margin-bottom: 20px; opacity: 0.8; }
    .campus-card-content .btn { color: var(--accent); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; font-family: 'Outfit', sans-serif;}

    .ambient-leaf { position: absolute; mix-blend-mode: multiply; pointer-events: none; opacity: 0.3; filter: blur(3px); }

    @media (max-width: 900px) {
      .cards-container { flex-direction: column; gap: 2rem; height: 100vh; overflow-y: auto; padding: 4rem 1rem; justify-content: flex-start; }
      .title-screen h1 { font-size: 3.5rem; }
      .title-screen h1 span { font-size: 3rem; }
    }
  </style>
</head>
<body>

  <div class="scene" id="scene">
    <div class="title-screen">
      <h1>Cool Schools <span>Initiative</span></h1>
      <p>South Texas Canopy Project</p>
    </div>
    <div class="instruction">Scroll or Click to Begin</div>
    <div class="leaf-layer">
      <img src="../../assets/mesquite_leaf.jpg" alt="Mesquite Leaf" class="leaf-img" id="leaf1">
      <img src="../../assets/live_oak_leaf.jpg" alt="Live Oak Leaf" class="leaf-img" id="leaf2">
      <img src="../../assets/cedar_elm_leaf.jpg" alt="Cedar Elm Leaf" class="leaf-img" id="leaf3">
    </div>
    <div class="cards-container">
      <div class="card" id="btn-donna">
        <img src="../../assets/logos/donna_isd.jpg" alt="Donna ISD Logo">
        <h2>Donna ISD</h2>
        <p>Unlock the path to view 8 active campus initiatives.</p>
        <button>Select District ↓</button>
      </div>
      <div class="card" id="btn-mercedes">
        <img src="../../assets/logos/mercedes_isd.jpg" alt="Mercedes ISD Logo">
        <h2>Mercedes ISD</h2>
        <p>Unlock the path to view 6 active campus initiatives.</p>
        <button>Select District ↓</button>
      </div>
    </div>
  </div>

  <div id="campus-path-section">
    <img src="../../assets/live_oak_leaf.jpg" class="ambient-leaf" style="top: 10%; left: -5%; width: 400px; transform: rotate(45deg);">
    <img src="../../assets/mesquite_leaf.jpg" class="ambient-leaf" style="top: 40%; right: -5%; width: 500px; transform: rotate(-30deg);">
    <img src="../../assets/cedar_elm_leaf.jpg" class="ambient-leaf" style="bottom: 10%; left: 10%; width: 350px; transform: rotate(110deg);">

    <h2 class="path-header" id="path-title">District Campuses</h2>
    <div class="timeline" id="timeline-container">
      <!-- Injected via JS -->
    </div>
  </div>

  <script>
    gsap.registerPlugin(Observer, ScrollTrigger, ScrollToPlugin);

    let isRevealed = false;

    function revealCards() {
      if (isRevealed) return;
      isRevealed = true;
      const tl = gsap.timeline();
      tl.to(".instruction", { opacity: 0, y: 20, duration: 0.5, ease: "power2.inOut" }, 0);
      tl.to(".title-screen", { opacity: 0, y: -40, duration: 0.8, ease: "power3.inOut" }, 0);
      tl.to("#leaf1", { x: "-80vw", y: "-50vh", rotation: -65, duration: 1.8, ease: "power3.inOut" }, 0.1);
      tl.to("#leaf2", { x: "70vw", y: "60vh", rotation: 90, duration: 1.7, ease: "power3.inOut" }, 0.15);
      tl.to("#leaf3", { x: "90vw", y: "-40vh", rotation: 160, duration: 1.9, ease: "power3.inOut" }, 0.05);
      tl.to(".cards-container", { opacity: 1, y: 0, duration: 1.2, ease: "power3.out" }, 0.7);
    }

    Observer.create({
      target: window,
      type: "wheel,touch,pointer",
      onUp: revealCards,
      onDown: revealCards,
      onLeft: revealCards,
      onRight: revealCards,
      onClick: revealCards,
      tolerance: 10
    });

    const campusData = {
      "donna": {
        title: "Donna ISD: The Cool Schools Path",
        campuses: [
          { name: "M. Rivas Primary", file: "donna_rivas.html", desc: "Pre-K to 2nd Grade Discovery Academy" },
          { name: "J.W. Caceres", file: "donna_jw_caceres.html", desc: "Intermediate Academy" },
          { name: "A.M. Ochoa", file: "donna_ochoa.html", desc: "Elementary Campus" },
          { name: "Capt. D. Salinas", file: "donna_salinas.html", desc: "Elementary Campus" },
          { name: "E.G. Garza", file: "donna_garza.html", desc: "Elementary Campus" },
          { name: "Singleterry", file: "donna_singleterry.html", desc: "Elementary Campus" },
          { name: "Solis", file: "donna_solis.html", desc: "Middle School Campus" },
          { name: "Stainke", file: "donna_stainke.html", desc: "Elementary Campus" }
        ]
      },
      "mercedes": {
        title: "Mercedes ISD: The Cool Schools Path",
        campuses: [
          { name: "Mercedes Early College", file: "mercedes_academy.html", desc: "High School Campus" },
          { name: "Sgt. William G. Chacon", file: "mercedes_chacon.html", desc: "Middle School Campus" },
          { name: "Kennedy / Harrell", file: "mercedes_harrell.html", desc: "Elementary Campus" },
          { name: "Mercedes High", file: "mercedes_high.html", desc: "High School Campus" },
          { name: "Ruben Hinojosa", file: "mercedes_hinojosa.html", desc: "Elementary Campus" },
          { name: "Travis", file: "mercedes_travis.html", desc: "Elementary Campus" }
        ]
      }
    };

    function unlockPath(districtId) {
      // Must reveal first if user just clicked directly
      revealCards();

      const data = campusData[districtId];
      document.getElementById('path-title').innerText = data.title;
      
      const container = document.getElementById('timeline-container');
      container.innerHTML = "";

      data.campuses.forEach((campus, index) => {
        const side = index % 2 === 0 ? 'left' : 'right';
        const nodeHTML = `
          <div class="timeline-node ${side}">
            <div class="campus-card-content" onclick="window.location.href='../../${campus.file}'">
              <h3>${campus.name}</h3>
              <p>${campus.desc}</p>
              <span class="btn">Enter Dashboard →</span>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', nodeHTML);
      });

      const pathSection = document.getElementById('campus-path-section');
      pathSection.style.display = "block";
      
      // Unlock body scrolling
      document.body.style.overflow = "auto";

      gsap.to(pathSection, { opacity: 1, duration: 1 });

      ScrollTrigger.refresh();

      gsap.utils.toArray('.timeline-node').forEach((node, i) => {
        gsap.to(node, {
          opacity: 1, y: 0, duration: 0.8, ease: "power2.out",
          scrollTrigger: { trigger: node, start: "top 85%", toggleActions: "play none none reverse" }
        });
      });

      gsap.to(window, { duration: 1.5, scrollTo: "#campus-path-section", ease: "power3.inOut" });
    }

    document.getElementById('btn-donna').addEventListener('click', () => unlockPath('donna'));
    document.getElementById('btn-mercedes').addEventListener('click', () => unlockPath('mercedes'));

  </script>
</body>
</html>
