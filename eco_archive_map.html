<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGV Eco-Archive Geographic Map</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="eco_archive_map.css">
    <!-- Google Fonts for aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <header class="map-header">
        <a href="index.html" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Back to Dashboard
        </a>
        <div class="header-content">
            <h1>Geographic Overlay</h1>
            <p>Explore the Rio Grande Valley Eco-Archive</p>
        </div>
    </header>

    <div class="viewport" id="viewport">
        <div class="map-container" id="map-container">
            <div class="map-background"></div>
            <!-- SVG for connecting paths -->
            <svg class="map-paths" id="map-paths"></svg>
            <!-- Map nodes will be injected here -->
            <div id="nodes-layer"></div>
        </div>
    </div>

    <!-- Info Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <button class="modal-close" id="modal-close">×</button>
            <div class="modal-icon" id="modal-icon"></div>
            <h2 id="modal-title">Title</h2>
            <div class="modal-meta">
                <span id="modal-type" class="badge">Type</span>
                <span id="modal-date">Date</span>
            </div>
            <p id="modal-desc">Description</p>
            <a href="#" id="modal-link" target="_blank" class="modal-action">Visit Link</a>
        </div>
    </div>

    <script src="rgv_archive_data.js"></script>
    <script src="eco_archive_map.js"></script>
</body>
</html>
