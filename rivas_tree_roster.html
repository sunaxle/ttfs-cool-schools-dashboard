<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivas Tree Roster - Cool Schools</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="rivas_tree_roster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <header class="app-header">
        <div class="brand-left"></div>
        <div class="title">M. Rivas Academy - Community Canopy</div>
        <div class="brand-right">
            <a href="donna_rivas.html" style="color: white; text-decoration: none;">← Back to Campus</a>
        </div>
    </header>

    <div class="roster-layout">
        <!-- Left Pane: Map -->
        <div class="map-pane">
            <div class="map-overlay-header">
                <h2>Campus Tree Map</h2>
                <p>150 Trees planted. Click a pin to view its steward.</p>
                <div class="legend">
                    <span class="legend-item"><span class="dot claimed-dot"></span> Claimed</span>
                    <span class="legend-item"><span class="dot available-dot"></span> Available</span>
                </div>
            </div>
            <!-- Simulated Map Area -->
            <div class="simulated-map" id="mapArea">
                <!-- Pins will be generated by JS -->
            </div>
        </div>

        <!-- Right Pane: Gallery -->
        <div class="gallery-pane">
            <div class="gallery-header">
                <h2>Tree Roster</h2>
                <div class="roster-stats">
                    <div class="stat-box">
                        <span class="stat-num" id="totalTrees">150</span>
                        <span class="stat-lbl">Total Trees</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-num" id="claimedTrees">--</span>
                        <span class="stat-lbl">Claimed</span>
                    </div>
                </div>
            </div>
            
            <div class="roster-grid" id="rosterGrid">
                <!-- Roster cards generated by JS -->
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="rivas_tree_roster.js"></script>
</body>
</html>
