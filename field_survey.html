<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="apple-touch-icon" href="assets/utrgv-agroecology.png" />
    <link rel="icon" type="image/png" href="assets/utrgv-agroecology.png" />
    <title>Field Survey | Cool Schools Ground-Truth</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="index.css" />
    <style>
        .survey-container {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--primary);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px; /* Prevents iOS zoom */
            font-family: inherit;
        }
        .gps-group {
            display: flex;
            gap: 10px;
        }
        .gps-group input {
            background: #f9f9f9;
        }
        .btn-gps {
            background: var(--green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .success-msg {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>

<body>
    <header class="app-header">
        <div class="title">Ground-Truth Survey</div>
    </header>

    <nav class="app-nav" style="overflow-x: auto; white-space: nowrap;">
        <a class="nav-link" href="index.html">← Back to Dashboard</a>
        <a class="nav-link active" href="field_survey.html">Field Survey App</a>
    </nav>

    <main class="page-container">
        <div class="survey-container">
            <h2 style="color: var(--primary); margin-bottom: 10px;">New Tree Observation</h2>
            <p style="color: #666; margin-bottom: 20px; font-size: 14px;">Log hyper-local green tech data directly from the field. This feeds into our real-time canopy modeling.</p>
            
            <div id="successMessage" class="success-msg">
                Observation successfully recorded and synced to the dashboard!
            </div>

            <form id="surveyForm">
                <div class="form-group">
                    <label for="observerName">Observer Name (or Team ID)</label>
                    <input type="text" id="observerName" required placeholder="e.g. UTRGV Team A" />
                </div>

                <div class="form-group">
                    <label for="campusSelect">Campus</label>
                    <select id="campusSelect" required>
                        <option value="">-- Select Campus --</option>
                        <option value="mercedes">Mercedes CSID</option>
                        <option value="donna">Donna ISD</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="surfaceZone">Surface Classification Zone</label>
                    <select id="surfaceZone" required>
                        <option value="">-- Select Zone --</option>
                        <option value="asphalt">Exposed Asphalt / Concrete</option>
                        <option value="grass">Open Turf / Grass</option>
                        <option value="canopy">Under Tree Canopy</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>GPS Location</label>
                    <div class="gps-group">
                        <input type="text" id="lat" placeholder="Latitude" readonly required />
                        <input type="text" id="lng" placeholder="Longitude" readonly required />
                    </div>
                    <button type="button" id="btnGetLocation" class="btn-gps" style="margin-top: 10px;">📍 Get Current Location</button>
                </div>

                <div class="form-group">
                    <label for="treeSpecies">Tree Species (If applicable)</label>
                    <select id="treeSpecies">
                        <option value="None">-- N/A --</option>
                        <option value="Bur Oak">Bur Oak</option>
                        <option value="Live Oak">Live Oak</option>
                        <option value="Montezuma Bald Cypress">Montezuma Bald Cypress</option>
                        <option value="Texas Pecan">Texas Pecan</option>
                        <option value="Mexican Sycamore">Mexican Sycamore</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="treeCount">Tree Count in 10m Radius</label>
                    <input type="number" id="treeCount" min="0" value="0" required />
                </div>

                <div class="form-group">
                    <label for="surfaceTemp">Observed Surface Temp (°F)</label>
                    <input type="number" id="surfaceTemp" placeholder="e.g. 105" />
                </div>

                <div class="form-group">
                    <label for="notes">Field Notes</label>
                    <textarea id="notes" rows="3" placeholder="Any additional observations about soil, wildlife, or tree health..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Submit Observation</button>
            </form>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="field_survey.js"></script>
</body>
</html>
