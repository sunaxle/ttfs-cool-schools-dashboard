<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGV Eco-Archive Map</title>
    <link rel="stylesheet" href="eco_archive_rpg.css">
</head>
<body>
    <div id="ui-layer">
        <header>
            <h1>RGV Eco-Archive Explorer</h1>
            <a href="index.html" class="back-link">← Back to Dashboard</a>
        </header>
        
        <div class="map-decoration">
            <div class="compass-icon">🧭</div>
            <div class="map-decoration-text">
                <h3>Regional Map</h3>
                <p>Click & Drag to Explore</p>
            </div>
        </div>

        <div id="modal-overlay" class="hidden">
            <div id="modal-card">
                <button id="modal-close">&times;</button>
                <div id="modal-icon"></div>
                <h2 id="modal-title"></h2>
                <p id="modal-date" class="meta-data"></p>
                <p id="modal-desc"></p>
                <a id="modal-link" href="#" target="_blank" class="action-btn">Explore Full Archive</a>
            </div>
        </div>
    </div>

    <!-- The massive map container -->
    <div id="map-viewport">
        <div id="rpg-map">
            <!-- Nodes and terrain will be injected here via JS -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="rgv_archive_data.js"></script>
    <script src="eco_archive_rpg.js"></script>
</body>
</html>
