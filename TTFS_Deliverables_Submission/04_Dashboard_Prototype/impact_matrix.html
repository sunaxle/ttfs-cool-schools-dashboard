<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://d3js.org" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="assets/utrgv-agroecology.png" />
    <link rel="icon" type="image/png" href="assets/utrgv-agroecology.png" />
    <meta name="description" content="UTRGV Agroecology Project Dashboard - Community Impact & Health" />
    <meta name="author" content="UTRGV Agroecology" />
    <title>Agroecology Taxonomy Tree</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="agriculture_physics_data.js"></script>
    <link rel="stylesheet" href="impact_matrix.css" />
</head>
<body>

    <div class="header">
        <h1>Agroecology Taxonomy Tree</h1>
        <p>Connecting fundamental science domains (roots) to modern practitioners (branches)</p>
    </div>

    <div id="tooltip">
        <h4 id="tt-name">Name</h4>
        <p id="tt-desc">Description goes here.</p>
    </div>

    <div id="chart-container"></div>

    <!-- The Impact Matrix UI Overlay -->
    <div id="impact-matrix-overlay">
        <div class="matrix-modal">
            <button type="button" class="matrix-close" id="btnCloseMatrix">✕</button>
            <div class="matrix-title" id="matrix-leaf-name">Student Node</div>
            <div class="matrix-subtitle">Connected Golden Path Network Entities</div>

            <table class="matrix-table">
                <thead>
                    <tr>
                        <th>Category Layer</th>
                        <th>Network Entity</th>
                    </tr>
                </thead>
                <tbody id="matrix-body">
                    <!-- Dynamic Data Injected Here -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="impact_matrix.js"></script>
</body>
</html>
